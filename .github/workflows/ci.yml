name: StockCheck CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r run build

      - name: Typecheck all packages
        run: |
          pnpm --filter "@stockcheck/core" typecheck
          pnpm --filter "@stockcheck/runtime" typecheck
          pnpm --filter "@stockcheck/test-wallet" typecheck
          pnpm --filter "@stockcheck/playwright" typecheck

      - name: Run unit tests
        run: pnpm test:unit

  e2e-tests:
    name: E2E Tests (with Surfpool)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install Surfpool CLI
        run: |
          curl -sL https://run.surfpool.run/ | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Start Surfpool
        run: |
          $HOME/.local/bin/surfpool start --ci --daemon --offline
          for i in {1..30}; do
            if curl -s -X POST http://127.0.0.1:8899 -H "Content-Type: application/json" -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}' | grep -q 'ok'; then
              echo "Surfpool is healthy!"
              break
            fi
            echo "Waiting for Surfpool RPC..."
            sleep 1
          done

      - name: Create synthetic mint
        run: node scripts/create-mint.mjs

      - name: Run required E2E suite
        run: pnpm test:e2e
        env:
          CI: "true"

      - name: Run specimen tests (assert checker detects defects)
        run: pnpm test:specimens
        env:
          CI: "true"

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          path: |
            playwright-report/
            playwright-report-specimens/
          retention-days: 30
