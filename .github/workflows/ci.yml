name: StockCheck CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r run build

      - name: Typecheck all packages
        run: |
          pnpm --filter "@stockcheck/core" typecheck
          pnpm --filter "@stockcheck/runtime" typecheck
          pnpm --filter "@stockcheck/test-wallet" typecheck
          pnpm --filter "@stockcheck/playwright" typecheck

      - name: Run unit tests
        run: pnpm test:unit

  e2e-tests:
    name: E2E Tests (with Surfpool)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install Surfpool CLI
        run: |
          curl -sL https://run.surfpool.run/ | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Start Surfpool
        run: |
          # Start Surfpool in foreground-as-background so we can tee its output
          $HOME/.local/bin/surfpool start --offline 2>&1 | tee surfpool-startup.log &
          SURFPOOL_PID=$!
          for i in {1..60}; do
            HEALTH=$(curl -s -X POST http://127.0.0.1:8899 -H "Content-Type: application/json" -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}' 2>/dev/null || echo '')
            if echo "$HEALTH" | grep -q 'ok'; then
              echo "Surfpool is healthy after ${i}s"
              break
            fi
            echo "Waiting for Surfpool RPC (attempt $i)..."
            sleep 1
          done
          # Additional 2s grace period for Surfpool to finish internal init
          sleep 2
          # Confirm getSlot works (proves ledger is ready, not just HTTP)
          SLOT=$(curl -s -X POST http://127.0.0.1:8899 -H "Content-Type: application/json" -d '{"jsonrpc":"2.0","id":1,"method":"getSlot"}' 2>/dev/null)
          echo "Current slot: $SLOT"
          if ! echo "$SLOT" | grep -q 'result'; then
            echo "ERROR: Surfpool RPC not ready — getSlot failed"
            cat surfpool-startup.log || true
            exit 1
          fi

      - name: Create synthetic mint
        run: node scripts/create-mint.mjs

      - name: Run required E2E suite
        run: node ./node_modules/@playwright/test/cli.js test --config playwright.config.ts --retries 1
        env:
          CI: "true"

      - name: Run specimen tests (assert checker detects defects)
        run: pnpm test:specimens
        env:
          CI: "true"

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          path: |
            playwright-report/
            playwright-report-specimens/
            surfpool-startup.log
          retention-days: 30
